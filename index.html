<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#14532d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>צולנט – ניהול הכנסות ורווחים</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icon.png">
  <link rel="apple-touch-icon" href="./icon.png">
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: #f3f5f8; color: #1f2937; padding: 14px 14px 40px; }
    .header { background: linear-gradient(135deg, #14532d, #166534); color: #fff; padding: 16px; border-radius: 16px; margin-bottom: 14px; box-shadow: 0 4px 12px rgba(20,83,45,0.2); }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .top-bar h1 { margin: 0; font-size: 19px; }
    .refresh-btn { background: rgba(255,255,255,0.18); border: none; color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .stat { background: rgba(255,255,255,0.14); padding: 10px 8px; border-radius: 10px; text-align: center; }
    .stat small { display: block; font-size: 11px; opacity: 0.85; margin-bottom: 2px; }
    .stat b { font-size: 16px; }
    .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
    .tab { flex: 1; padding: 11px 6px; border: none; border-radius: 10px; background: #e5e7eb; color: #374151; font-weight: 700; font-size: 13px; cursor: pointer; }
    .tab.active { background: #14532d; color: #fff; }
    .card { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 5px rgba(0,0,0,0.06); }
    label { display: block; font-size: 12px; font-weight: 700; margin: 10px 0 4px; color: #374151; }
    input, select { width: 100%; padding: 11px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 15px; background: #fff; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn { width: 100%; padding: 13px; border: none; border-radius: 10px; background: #16a34a; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 14px; }
    .btn:disabled { opacity: 0.6; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: center; }
    th { background: #dcfce7; color: #14532d; padding: 9px 4px; border-bottom: 2px solid #bbf7d0; }
    td { padding: 9px 4px; border-bottom: 1px solid #f1f5f9; }
    .ok { color: #15803d; font-weight: 700; }
    .wait { color: #9ca3af; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #111827; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 700; display: none; z-index: 99; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <div class="top-bar">
      <h1>צולנט – ניהול הכנסות</h1>
      <button class="refresh-btn" onclick="loadData()">רענן ↻</button>
    </div>
    <div class="stats">
      <div class="stat"><small>סה"כ הכנסות</small><b id="sInc">...</b></div>
      <div class="stat"><small>רווח נקי</small><b id="sProf">...</b></div>
      <div class="stat"><small>עלות סירים</small><b id="sCost">...</b></div>
      <div class="stat"><small>יתרה לספק</small><b id="sBal">...</b></div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('income', this)">הזנת הכנסות</button>
    <button class="tab" onclick="showTab('pay', this)">תשלומים לספק</button>
    <button class="tab" onclick="showTab('profit', this)">רווחים וחודשים</button>
  </div>

  <div id="income" class="card">
    <label>בחר שבוע</label>
    <select id="wSelect" onchange="fillWeek()"></select>
    <div class="grid2">
      <div><label>מזומן (₪)</label><input id="wCash" type="number" step="0.01" inputmode="decimal"></div>
      <div><label>אשראי (₪)</label><input id="wCredit" type="number" step="0.01" inputmode="decimal"></div>
      <div><label>סירים שהוזמנו</label><input id="wPots" type="number" step="0.5" inputmode="decimal"></div>
      <div><label>כמה הסתיים</label><input id="wFin" type="text"></div>
    </div>
    <button class="btn" onclick="saveWeek(this)">שמור נתוני שבוע ✓</button>
  </div>

  <div id="pay" class="hidden">
    <div class="card">
      <div class="grid2">
        <div><label>תאריך תשלום</label><input id="pDate" type="date"></div>
        <div><label>אמצעי תשלום</label><select id="pMethod"><option value="העברה">העברה</option><option value="מזומן">מזומן</option></select></div>
      </div>
      <label>סכום (₪)</label>
      <input id="pAmt" type="number" step="0.01" inputmode="decimal" placeholder="למשל 5000">
      <button class="btn" onclick="savePay(this)">שמור תשלום ושלח התראה לספק ✓</button>
    </div>
    <div class="card" style="overflow-x:auto;">
      <div style="font-size:12px;margin-bottom:8px;"><b>מזומן:</b> <span id="cPaid">...</span> | <b>העברה:</b> <span id="bPaid">...</span></div>
      <table id="payTable"></table>
    </div>
  </div>

  <div id="profit" class="card hidden" style="overflow-x:auto;">
    <table id="monthTable"></table>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzUmmgIKSTJfIfxyCkpr9vxXgJTbD_LzaCLrg5T-DdqIm7y9drmnsfnisQqWpLAh5hVoA/exec";
    let appData = null;
    document.getElementById('pDate').valueAsDate = new Date();

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 2500);
    }

    function showTab(id, btn) {
      ['income','pay','profit'].forEach(t => document.getElementById(t).classList.toggle('hidden', t !== id));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
    }

    function fillWeek() {
      if (!appData) return;
      const row = Number(document.getElementById('wSelect').value);
      const w = appData.weeks.find(x => x.row === row);
      if (!w) return;
      document.getElementById('wCash').value = w.cash;
      document.getElementById('wCredit').value = w.credit;
      document.getElementById('wPots').value = w.pots;
      document.getElementById('wFin').value = w.finished;
    }

    function render(data) {
      appData = data;
      document.getElementById('sInc').textContent = data.totalIncome;
      document.getElementById('sProf').textContent = data.totalProfit;
      document.getElementById('sCost').textContent = data.totalCost;
      document.getElementById('sBal').textContent = data.supplierBal;
      document.getElementById('cPaid').textContent = data.cashPaid;
      document.getElementById('bPaid').textContent = data.bankPaid;

      const sel = document.getElementById('wSelect');
      const prev = sel.value;
      sel.innerHTML = data.weeks.map(w => `<option value="${w.row}">${w.date} (${w.heb})</option>`).join('');
      if (prev) sel.value = prev;
      else sel.value = (data.weeks.find(w => w.cash === "" && w.pots === "") || {}).row || 2;
      fillWeek();

      document.getElementById('payTable').innerHTML = `<thead><tr><th>תאריך</th><th>אמצעי</th><th>סכום</th><th>אישור</th><th>קבלה</th></tr></thead><tbody>`
        + data.payments.map(p => `<tr><td>${p.date}</td><td>${p.method}</td><td><b>${p.amount}</b></td><td class="${p.confirmed?'ok':'wait'}">${p.confirmed?'✓':'ממתין'}</td><td class="${p.receipt?'ok':'wait'}">${p.receipt?'✓':'חסר'}</td></tr>`).join('') + '</tbody>';

      document.getElementById('monthTable').innerHTML = `<thead><tr><th>חודש</th><th>מזומן</th><th>אשראי</th><th>הכנסות</th><th>סירים</th><th>רווח</th></tr></thead><tbody>`
        + data.months.map(m => `<tr><td><b>${m.name}</b></td><td>${m.cash}</td><td>${m.credit}</td><td>${m.income}</td><td>${m.cost}</td><td class="ok">${m.profit}</td></tr>`).join('') + '</tbody>';
    }

    async function loadData() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        render(data);
      } catch (e) {
        toast('שגיאה בטעינת הנתונים');
      }
    }

    async function postAction(payload, btn, defaultText) {
      btn.disabled = true;
      btn.textContent = 'שומר...';
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        render(data);
        toast('נשמר בהצלחה ✓');
      } catch (e) {
        toast('שגיאה בשמירה');
      } finally {
        btn.disabled = false;
        btn.textContent = defaultText;
      }
    }

    function saveWeek(btn) {
      postAction({
        action: 'saveWeek',
        row: Number(document.getElementById('wSelect').value),
        cash: document.getElementById('wCash').value,
        credit: document.getElementById('wCredit').value,
        pots: document.getElementById('wPots').value,
        finished: document.getElementById('wFin').value
      }, btn, 'שמור נתוני שבוע ✓');
    }

    function savePay(btn) {
      const amt = document.getElementById('pAmt').value;
      if (!amt) return alert('נא להזין סכום');
      postAction({
        action: 'addPayment',
        date: document.getElementById('pDate').value,
        method: document.getElementById('pMethod').value,
        amount: amt
      }, btn, 'שמור תשלום ושלח התראה לספק ✓').then(() => {
        document.getElementById('pAmt').value = '';
      });
    }

    loadData();
  </script>
</body>
</html>
